name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

      - name: Audit Client Bundles for Secret Leaks
        run: |
          if grep -rq "SUPABASE_SERVICE_ROLE_KEY" .next/static/; then
            echo "::error::SECURITY ALERT: SUPABASE_SERVICE_ROLE_KEY found in client-side static chunks!"
            exit 1
          fi
          echo "Security verification passed: No service role keys found in client bundles."
